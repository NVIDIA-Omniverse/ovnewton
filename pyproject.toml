[project]
name = "ovnewton"
version = "0.2.0"
description = "Connect the Newton physics engine to ovstage / the Omniverse library ecosystem."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "NVIDIA CORPORATION & AFFILIATES" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "ovstage>=0.2.0.377349,<0.3",
    "newton>=1.6.0",
    "newton-usd-schemas>=0.5.0,<0.6",
    "physx-usd-schemas>=25.11.1,<26",
    "warp-lang>=1.17.0",
    "numpy>=1.26.0; python_version < '3.13'",
    "numpy>=2.1.0; python_version == '3.13'",
    "numpy>=2.3.2; python_version >= '3.14'",
    # Backends used by ModelBuilder.approximate_meshes.
    "coacd>=1.0.7",
    "scipy>=1.11.2; python_version < '3.13'",
    "scipy>=1.14.1; python_version == '3.13'",
    "scipy>=1.16.1; python_version >= '3.14'",
    "fast-simplification>=0.1.13",
]

[project.urls]
Repository = "https://github.com/NVIDIA-Omniverse/ovnewton"
Documentation = "https://nvidia-omniverse.github.io/ovnewton/"
Issues = "https://github.com/NVIDIA-Omniverse/ovnewton/issues"

[project.optional-dependencies]
dev = [
    "newton[importers]>=1.6.0",
    "pytest>=8",
    "ruff>=0.15",
]
assets-audit = [
    "GitPython>=3.2.0",
]
examples = [
    "newton[sim]>=1.6.0",
    "ovrtx>=0.5.0.377615,<0.6",
    "pillow>=12.3.0",
    "pyglet>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = [
    "ovnewton/__init__.py",
    "ovnewton/_build_info.py",
    "ovnewton/_version.py",
    "ovnewton/py.typed",
    "ovnewton/_src",
    "ovnewton/examples/__init__.py",
    "ovnewton/examples/assets/README.md",
    "ovnewton/examples/assets/scene_cartpole.usda",
    "ovnewton/examples/assets/scene_rigid_bodies.usda",
    "ovnewton/examples/example_ovnewton_basic.py",
    "ovnewton/examples/example_ovnewton_robot.py",
    "ovnewton/examples/utils",
    "ovnewton/tests/__init__.py",
    "ovnewton/tests/conftest.py",
    "ovnewton/tests/diff_harness.py",
    "ovnewton/tests/newton_assets_diff.py",
    "ovnewton/tests/run.sh",
    "ovnewton/tests/runtime_helpers.py",
    "ovnewton/tests/test_add_ovstage.py",
    "ovnewton/tests/test_byo.py",
    "ovnewton/tests/test_cuda_write.py",
    "ovnewton/tests/test_deformable_inputs.py",
    "ovnewton/tests/test_diff.py",
    "ovnewton/tests/test_diff_harness_selfcheck.py",
    "ovnewton/tests/test_newton_assets_diff.py",
    "ovnewton/tests/test_output_read.py",
    "ovnewton/tests/test_population_contract.py",
    "ovnewton/tests/test_runtime.py",
    "ovnewton/tests/test_schema_registration.py",
    "ovnewton/tests/test_schema_names.py",
    "ovnewton/tests/test_smoke.py",
    "ovnewton/tests/test_topology.py",
    "ovnewton/tests/test_write.py",
    "ovnewton/tests/typecheck_public_api.py",
    "docs/site",
]

[tool.hatch.build.targets.sdist.force-include]
".licenserc.yaml" = ".licenserc.yaml"
"CHANGELOG.md" = "CHANGELOG.md"
"SECURITY.md" = "SECURITY.md"

[tool.hatch.build.targets.wheel]
only-include = [
    "ovnewton/__init__.py",
    "ovnewton/py.typed",
    "ovnewton/_src",
    "ovnewton/_build_info.py",
    "ovnewton/_version.py",
    "ovnewton/examples/__init__.py",
    "ovnewton/examples/example_ovnewton_basic.py",
    "ovnewton/examples/example_ovnewton_robot.py",
    "ovnewton/examples/assets/README.md",
    "ovnewton/examples/assets/scene_rigid_bodies.usda",
    "ovnewton/examples/assets/scene_cartpole.usda",
    "ovnewton/examples/utils/__init__.py",
    "ovnewton/examples/utils/transform_relay.py",
    "ovnewton/examples/utils/viewport.py",
]

[dependency-groups]
assets-audit = ["GitPython>=3.2.0"]
dev = ["basedpyright>=1.39.9", "newton[importers]>=1.6.0", "pytest>=8", "ruff>=0.15"]
docs = [
    "sphinx>=7.4",
    "myst-parser>=3.0",
    "nvidia-sphinx-theme>=0.0.7",
    "sphinx-copybutton>=0.5",
]

# Keep uv management explicit for dependency discovery.
[tool.uv]
managed = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Start high-signal, low-noise: pyflakes (F — unused imports/vars, undefined
# names; would have caught the dead last_ordinal), pycodestyle (E/W), import
# sorting (I). Broaden (B, UP, …) once this baseline is clean.
select = ["E", "F", "W", "I"]
ignore = [
    "E741",  # ambiguous name `I` — the inertia tensor, a math convention here
    "E702",  # multiple statements per line — a deliberate compact idiom for
             # vector/quaternion component writes and matrix-row extraction
             # (`m00 = …; m01 = …; m02 = …` reads as one row) in the kernels
]

[tool.basedpyright]
pythonVersion = "3.11"
reportMissingTypeStubs = false
reportUnusedFunction = false
venv = ".venv"
venvPath = "."

[tool.ruff.lint.per-file-ignores]
# The example sets up sys.path before importing ovstage/ovrtx, so module-level
# imports legitimately follow code.
"ovnewton/examples/*.py" = ["E402"]
